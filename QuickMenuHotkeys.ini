; ============================================================
;  Keyboard Key Reference
;  Use these hex values for Hotkey and ModifierKey fields.
; ============================================================
;
;  Letters:    A=41 B=42 C=43 D=44 E=45 F=46 G=47 H=48
;              I=49 J=4A K=4B L=4C M=4D N=4E O=4F P=50
;              Q=51 R=52 S=53 T=54 U=55 V=56 W=57 X=58
;              Y=59 Z=5A
;
;  Numbers:    0=30 1=31 2=32 3=33 4=34 5=35 6=36 7=37 8=38 9=39
;
;  F-Keys:     F1=70  F2=71  F3=72  F4=73  F5=74  F6=75
;              F7=76  F8=77  F9=78  F10=79 F11=7A F12=7B
;              F13=7C F14=7D F15=7E F16=7F F17=80 F18=81
;              F19=82 F20=83 F21=84 F22=85 F23=86 F24=87
;
;  Numpad:     Num0=60 Num1=61 Num2=62 Num3=63 Num4=64
;              Num5=65 Num6=66 Num7=67 Num8=68 Num9=69
;              Multiply=6A  Add=6B  Subtract=6D  Decimal=6E  Divide=6F
;
;  Navigation: Insert=2D  Delete=2E  Home=24  End=23
;              PageUp=21  PageDown=22
;              Left=25  Up=26  Right=27  Down=28
;
;  Modifiers:  Shift=10  Ctrl=11  Alt=12
;              LShift=A0  RShift=A1  LCtrl=A2  RCtrl=A3
;              LAlt=A4  RAlt=A5
;
;  Special:    Tab=09  Esc=1B  Space=20  Enter=0D  Backspace=08
;              CapsLock=14  NumLock=90  ScrollLock=91
;              PrintScreen=2C  Pause=13
;
;  Punctuation: ;=BA  ==BB  ,=BC  -=BD  .=BE  /=BF  `=C0
;               [=DB  \=DC  ]=DD  '=DE
;
;  Mouse:      Side1=05  Side2=06
;
;  Media:      VolumeMute=AD  VolumeDown=AE  VolumeUp=AF
;              NextTrack=B0  PrevTrack=B1  Stop=B2  PlayPause=B3

; ============================================================
;  Controller Button Reference (XInput)
;  Use these hex values for ControllerButton and ControllerModifier.
; ============================================================
;
;  D-Pad:      Up=0001  Down=0002  Left=0004  Right=0008
;  Menu:       Start/Menu=0010     Back/View=0020
;  Sticks:     LeftStick=0040      RightStick=0080
;  Bumpers:    LB=0100             RB=0200
;  Face:       A=1000  B=2000      X=4000    Y=8000
;
;  Note: Non-Xbox controllers (Switch, etc.) work through Steam Input.

; ============================================================
;  PS5 / PS4 Controller Button Reference (HID)
;  Use these names for PSButton and PSModifier (case-insensitive).
; ============================================================
;
;  Face:       Circle  Triangle  Square  Cross
;  Bumpers:    L1  R1
;  Sticks:     L3  R3
;  Menu:       Share  Options
;  Special:    Touchpad  PS  Mute (Mute = DualSense only)
;  Disable:    none
;
;  Supported controllers: DualSense, DualSense Edge, DualShock 4 v1/v2
;  Works over USB and Bluetooth — no Steam Input required.
