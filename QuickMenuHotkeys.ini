[Settings]
Enabled=1
; Create log file for troubleshooting (0=off, 1=on)
DebugLog=0
; Block game's hardcoded keybinds (I,J,K,M) when you remap them (1=on, 0=off)
OverrideGameKeys=1
; Controller support via XInput (0=off, 1=on)
ControllerEnabled=1
; Hold this button before pressing panel buttons (0000=no modifier)
; Example: 0100 = LB as modifier, so LB+A opens a panel
ControllerModifier=0000

; ============================================================
;  Keybinds — Virtual Key Codes (hex)
;  Set Hotkey=00 to disable a panel keybind.
;  Set ControllerButton=0000 to disable controller for that panel.
; ============================================================

[Inventory]
; InventoryEquipmentPanel
Hotkey=49
ControllerButton=0000

[QuestBook]
; QuestMenuPanel
Hotkey=4A
ControllerButton=0000

[SkillBook]
; SkillTreePanel
Hotkey=4B
ControllerButton=0000

[Knowledge]
; KnowledgePanel2
Hotkey=4C
ControllerButton=0000

[Options]
; LogoutView (Other menu)
Hotkey=4F
ControllerButton=0000

[Map]
; WorldMapView
Hotkey=4D
ControllerButton=0000

; ============================================================
;  Extra Panels — no default keybind (set to 00)
;  Assign your own hotkeys below!
; ============================================================

[Challenge]
; ChallengeMenuPanel2
Hotkey=00
ControllerButton=0000

[FactionQuest]
; FactionQuestMenuPanel
Hotkey=00
ControllerButton=0000

[Guides]
; PlayGuideView
Hotkey=00
ControllerButton=0000

[Notifications]
; AlertHistoryView
Hotkey=00
ControllerButton=0000

; ============================================================
;  Keyboard Key Reference (VK Codes)
; ============================================================
;
;  --- Letters ---
;  A=0x41  B=0x42  C=0x43  D=0x44  E=0x45  F=0x46  G=0x47
;  H=0x48  I=0x49  J=0x4A  K=0x4B  L=0x4C  M=0x4D  N=0x4E
;  O=0x4F  P=0x50  Q=0x51  R=0x52  S=0x53  T=0x54  U=0x55
;  V=0x56  W=0x57  X=0x58  Y=0x59  Z=0x5A
;
;  --- Numbers (top row) ---
;  0=0x30  1=0x31  2=0x32  3=0x33  4=0x34
;  5=0x35  6=0x36  7=0x37  8=0x38  9=0x39
;
;  --- Function Keys ---
;  F1=0x70   F2=0x71   F3=0x72   F4=0x73   F5=0x74   F6=0x75
;  F7=0x76   F8=0x77   F9=0x78   F10=0x79  F11=0x7A  F12=0x7B
;  F13=0x7C  F14=0x7D  F15=0x7E  F16=0x7F  F17=0x80  F18=0x81
;  F19=0x82  F20=0x83  F21=0x84  F22=0x85  F23=0x86  F24=0x87
;
;  --- Numpad ---
;  Numpad0=0x60  Numpad1=0x61  Numpad2=0x62  Numpad3=0x63
;  Numpad4=0x64  Numpad5=0x65  Numpad6=0x66  Numpad7=0x67
;  Numpad8=0x68  Numpad9=0x69
;  NumpadMul=0x6A  NumpadAdd=0x6B  NumpadSub=0x6D
;  NumpadDot=0x6E  NumpadDiv=0x6F
;
;  --- Navigation ---
;  INSERT=0x2D  DELETE=0x2E  HOME=0x24  END=0x23
;  PAGEUP=0x21  PAGEDOWN=0x22
;  LEFT=0x25  UP=0x26  RIGHT=0x27  DOWN=0x28
;
;  --- Modifiers ---
;  SHIFT=0x10  CTRL=0x11  ALT=0x12
;  LSHIFT=0xA0  RSHIFT=0xA1  LCTRL=0xA2  RCTRL=0xA3
;  LALT=0xA4  RALT=0xA5
;
;  --- Special ---
;  TAB=0x09  ESC=0x1B  SPACE=0x20  ENTER=0x0D  BACKSPACE=0x08
;  CAPSLOCK=0x14  NUMLOCK=0x90  SCROLLLOCK=0x91
;  PRINTSCREEN=0x2C  PAUSE=0x13
;
;  --- Punctuation ---
;  SEMICOLON=0xBA  EQUALS=0xBB  COMMA=0xBC  MINUS=0xBD
;  PERIOD=0xBE  SLASH=0xBF  BACKTICK=0xC0
;  LBRACKET=0xDB  BACKSLASH=0xDC  RBRACKET=0xDD  QUOTE=0xDE
;
;  --- Mouse (extra buttons) ---
;  XBUTTON1=0x05  XBUTTON2=0x06
;
;  --- Browser / Media ---
;  BROWSER_BACK=0xA6  BROWSER_FORWARD=0xA7  BROWSER_REFRESH=0xA8
;  VOLUME_MUTE=0xAD  VOLUME_DOWN=0xAE  VOLUME_UP=0xAF
;  MEDIA_NEXT=0xB0  MEDIA_PREV=0xB1  MEDIA_STOP=0xB2  MEDIA_PLAY=0xB3

; ============================================================
;  Controller Button Reference (XInput)
; ============================================================
;
;  --- D-Pad ---
;  DPAD_UP=0001    DPAD_DOWN=0002   DPAD_LEFT=0004   DPAD_RIGHT=0008
;
;  --- Menu ---
;  START=0010      BACK=0020
;
;  --- Stick Click ---
;  LEFT_STICK=0040   RIGHT_STICK=0080
;
;  --- Bumpers ---
;  LB=0100         RB=0200
;
;  --- Face Buttons ---
;  A=1000          B=2000           X=4000           Y=8000
;
;  Note: Non-Xbox controllers work via Steam Input (enabled by default).
;  Set ControllerModifier in [Settings] to require holding a button
;  (e.g. LB=0100) before panel buttons are recognized.
