; ============================================================
;  Quick Menu Hotkeys v1.7.1 — Configuration
; ============================================================

[Settings]

; Master switch — set to 0 to disable the entire mod
Enabled=1

; Write a log file next to the .asi for troubleshooting
DebugLog=0

; When you remap a game-default key (I, J, K, M), the game's
; hardcoded keybind for that key is automatically disabled.
; Set to 0 if you want the game's original keybinds to stay active.
OverrideGameKeys=1

; Press this key to reload the INI without restarting the game.
; Example: 7A = F11. Set to 00 to disable.
ReloadKey=7A

; Enable controller support (XInput). Xbox controllers work natively.
; PlayStation, Switch, and other controllers work through Steam Input.
ControllerEnabled=1

; Optional: require holding a controller button before panel buttons
; are recognized. Recommended to avoid conflicts with in-game controls.
; Example: 0100 = LB, so LB + D-Pad Up would open Inventory.
; Set to 0000 for no modifier (panel buttons work on their own).
ControllerModifier=0000

; ============================================================
;  Panel Keybinds
;
;  Hotkey         = Keyboard key (hex VK code, 00 = disabled)
;  ModifierKey    = Hold this key + Hotkey (00 = no modifier)
;                   Example: Hotkey=4A + ModifierKey=10 = Shift+J
;  ControllerButton = Controller button (hex, 0000 = disabled)
; ============================================================

; --- Default panels (keybinds match common RPG conventions) ---

[Inventory]
Hotkey=49
ModifierKey=00
ControllerButton=0000

[QuestBook]
Hotkey=4A
ModifierKey=00
ControllerButton=0000

[SkillBook]
